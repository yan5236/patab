<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">PaTab</title>
  <desc id="desc">把浏览器新标签页变成由搜索、快捷方式、文件夹、待办和 Dock 组成的本地工作台。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091A35"/>
      <stop offset="0.55" stop-color="#153557"/>
      <stop offset="1" stop-color="#0B5669"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#4DE2C5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="-10" r="220" fill="#4DE2C5" opacity="0.08"/>
  <circle cx="650" cy="420" r="270" fill="#6C8CFF" opacity="0.08"/>

  <g id="title-block" transform="translate(64 52)">
    <g aria-label="PaTab 图标">
      <rect width="58" height="58" rx="16" fill="url(#brand)"/>
      <rect x="10" y="11" width="38" height="10" rx="5" fill="#FFFFFF" opacity="0.82"/>
      <rect x="10" y="27" width="10" height="10" rx="3" fill="#FFFFFF" opacity="0.72"/>
      <rect x="24" y="27" width="10" height="10" rx="3" fill="#FFFFFF" opacity="0.58"/>
      <rect x="38" y="27" width="10" height="20" rx="3" fill="#FFFFFF" opacity="0.72"/>
      <rect x="10" y="41" width="24" height="6" rx="3" fill="#FFFFFF" opacity="0.48"/>
    </g>
    <text x="78" y="19" fill="#A8C4DA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" letter-spacing="2">LOCAL-FIRST · NEW TAB WORKSPACE</text>
    <text x="0" y="158" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="88" font-weight="760" letter-spacing="-3">PaTab</text>
    <text x="0" y="213" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="650">把新标签页，变成你的工作台</text>
    <text x="0" y="254" fill="#BFD1DF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">快捷方式 · 搜索 · 文件夹 · 待办 · Dock</text>
    <g transform="translate(0 285)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600">
      <rect width="142" height="36" rx="18" fill="#FFFFFF" opacity="0.11"/>
      <circle cx="20" cy="18" r="5" fill="#4DE2C5"/>
      <text x="34" y="24" fill="#EAF5F7">无需账号</text>
      <rect x="154" width="164" height="36" rx="18" fill="#FFFFFF" opacity="0.11"/>
      <circle cx="174" cy="18" r="5" fill="#83A0FF"/>
      <text x="188" y="24" fill="#EAF5F7">数据留在本地</text>
    </g>
  </g>

  <g id="workspace-proof" transform="translate(724 40)">
    <rect width="412" height="320" rx="26" fill="#F6FAFC" opacity="0.96"/>
    <rect x="24" y="24" width="364" height="48" rx="24" fill="#E7EDF2"/>
    <circle cx="48" cy="48" r="10" fill="url(#brand)"/>
    <text x="68" y="55" fill="#5E6A74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">搜索你的下一站</text>
    <circle cx="360" cy="48" r="8" fill="none" stroke="#40515F" stroke-width="2"/>
    <path d="M366 54l6 6" stroke="#40515F" stroke-width="2" stroke-linecap="round"/>

    <g transform="translate(24 94)">
      <rect width="76" height="76" rx="20" fill="#FFFFFF" stroke="#D8E0E7"/>
      <rect x="116" width="76" height="76" rx="20" fill="#FFFFFF" stroke="#D8E0E7"/>
      <rect x="12" y="14" width="22" height="22" rx="7" fill="#6C8CFF"/>
      <rect x="42" y="14" width="22" height="22" rx="7" fill="#4DE2C5"/>
      <rect x="12" y="44" width="52" height="18" rx="6" fill="#D8E5F0"/>
      <circle cx="154" cy="31" r="14" fill="#FFB879"/>
      <rect x="136" y="52" width="36" height="8" rx="4" fill="#CBD7E0"/>
    </g>

    <g transform="translate(232 94)">
      <rect width="156" height="128" rx="20" fill="#FFFFFF" stroke="#D8E0E7"/>
      <text x="18" y="31" fill="#2B3B49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="700">今天</text>
      <rect x="18" y="48" width="14" height="14" rx="3" fill="none" stroke="#6C8CFF" stroke-width="2"/>
      <rect x="42" y="51" width="88" height="8" rx="4" fill="#C8D4DD"/>
      <rect x="18" y="78" width="14" height="14" rx="3" fill="#4DE2C5"/>
      <path d="M21 85l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="42" y="81" width="70" height="8" rx="4" fill="#D9E1E7"/>
    </g>

    <g transform="translate(24 246)">
      <rect width="364" height="50" rx="20" fill="#DCE5E9"/>
      <rect x="52" y="9" width="34" height="34" rx="10" fill="#FFFFFF"/>
      <rect x="98" y="9" width="34" height="34" rx="10" fill="#FFFFFF"/>
      <rect x="144" y="9" width="34" height="34" rx="10" fill="#FFFFFF"/>
      <rect x="190" y="9" width="34" height="34" rx="10" fill="#FFFFFF"/>
      <rect x="236" y="9" width="34" height="34" rx="10" fill="#FFFFFF"/>
      <circle cx="69" cy="26" r="7" fill="#6C8CFF"/>
      <circle cx="115" cy="26" r="7" fill="#0F172A"/>
      <circle cx="161" cy="26" r="7" fill="#4DE2C5"/>
      <circle cx="207" cy="26" r="7" fill="#FFB879"/>
      <path d="M247 26h12M253 20v12" stroke="#61717D" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
