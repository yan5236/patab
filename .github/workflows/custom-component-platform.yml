name: Custom component platform CI

on:
  pull_request:
    paths:
      - 'patab-web/**'
      - 'packages/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/**'
      - 'specs/001-custom-component-platform/**'
      - '.github/workflows/custom-component-platform.yml'
  push:
    branches:
      - main
    paths:
      - 'patab-web/**'
      - 'packages/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/**'
      - 'specs/001-custom-component-platform/**'
      - '.github/workflows/custom-component-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify custom component platform
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查、单元与集成测试
        working-directory: patab-web
        run: |
          # 先构建 workspace 依赖包（sdk / package / cli 的 types 与 imports 指向 dist 产物），
          # 再对消费它们的 patab-web 做类型检查与测试
          pnpm --filter @patab/widget-sdk type-check
          pnpm --filter @patab/widget-sdk test
          pnpm --filter @patab/widget-sdk build
          pnpm --filter @patab/widget-package type-check
          pnpm --filter @patab/widget-package test
          pnpm --filter @patab/widget-package build
          pnpm --filter @patab/widget-cli type-check
          pnpm --filter @patab/widget-cli test
          pnpm --filter @patab/widget-cli build
          pnpm --filter create-patab-widget type-check
          pnpm --filter create-patab-widget test
          pnpm --filter create-patab-widget build
          pnpm type-check
          pnpm exec vitest run --no-file-parallelism

      - name: Web 与 MV3 生产构建
        working-directory: patab-web
        run: |
          pnpm build
          pnpm build:extension

      - name: 官方示例、确定性 ZIP 与签名验证
        run: |
          # install 时 widget-cli 尚未构建，dist/bin.js 缺失导致示例的 bin 链接创建失败；
          # cli 构建完成后再次 install，pnpm 会补建失效的 bin 链接（pnpm rebuild 不会重建链接）
          pnpm install --frozen-lockfile
          node scripts/verify-widget-examples.mjs

      - name: 官方示例的网页导入契约
        working-directory: patab-web
        run: pnpm exec vitest run src/custom-components/import/examplePackageImport.spec.ts
